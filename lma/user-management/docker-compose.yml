version: "3.5"

services:
  mongo:
    container_name: user_management_dev
    image: mongo:4.4.2
    command: mongod --port 27017

  mongo_seed:
    image: 'pkosiec/mongo-seeding:3.0.0'
    environment:
      - DROP_DATABASE=true
      - REPLACE_ID=true
      - DB_NAME=user-management
      - DB_PORT=27017
      - DB_HOST=mongo
    volumes:
      - ./datastore:/datastore
    working_dir: /datastore
    links:
      - mongo
    depends_on:
      - mongo

  server:
    image: 'node:14.6.0'
    container_name: user_management_server
    volumes:
      - ./server:/server
    working_dir: /server
    environment:
      - PORT=3000
      - CLIENT_ORIGIN=http://localhost
      - DB_CONNECTION_STRING=mongodb://mongo:27017/user-management
      - OVERNIGHT_JWT_SECRET="my super long random string for fake auth"
      - OVERNIGHT_JWT_EXP=24h
    command: npm start
    depends_on:
      - mongo

  client:
    image: node:16-alpine 
    container_name: user-management-client
    working_dir: /app
    volumes:
      - ./client:/app
    environment:
      - REACT_APP_API_URL=/api
      - API_BASE_URL=/api
    command: sh -c "npm install --legacy-peer-deps && npm start"
    depends_on:
      - server
  
  nginx:
    image: nginx:alpine
    container_name: user-management-nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - client
      - server

  fluent-bit:
    image: fluent/fluent-bit:3.0
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./parsers.conf:/fluent-bit/etc/parsers.conf
      - ./logs/nginx:/var/log/nginx:ro
    depends_on:
      - nginx
    network_mode: host 
