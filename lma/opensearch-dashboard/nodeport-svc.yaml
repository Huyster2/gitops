apiVersion: v1
kind: Service
metadata:
  name: opensearch-nodeport-service
  namespace: logging
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: opensearch-dashboard 
  ports:
    - port: 5601       # The port exposed inside the cluster
      targetPort: 5601   # The container port your app listens on
      nodePort: 30080    # Optional: External port on each node (30000-32767)

