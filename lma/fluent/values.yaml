podSecurityPolicy:
  create: false

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |
    #    [INPUT]
    #        Name tail
    #        Path /var/log/nginx/*.log
    #        multiline.parser docker, cri
    #        Tag kube.*
    #        Mem_Buf_Limit 5MB
    #        Skip_Long_Lines On

    [INPUT]
        Name              tail
        Tag               opensearch.*
        Path              /var/log/containers/*opensearch*.log
        multiline.parser  docker, cri
        Mem_Buf_Limit     2MB
        Skip_Long_Lines   On

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

  ## https://docs.fluentbit.io/manual/pipeline/outputs
  outputs: |

    [OUTPUT]
        name opensearch
        match opensearch.*
        host 10.96.56.218
        port  9200
        tls             On
        tls.verify      Off
        http_user admin 
        http_passwd Chrlghk#123
        index opensearch-logs
        type  _doc
        suppress_type_name  On
        logstash_prefix logstash
        logstash_prefix_key $kubernetes['namespace_name']

  customParsers: |
    [PARSER]
        Name docker_no_time
        Format json
        Time_Keep Off
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%L

